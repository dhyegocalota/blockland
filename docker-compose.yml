services:
  game-server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ADMIN_TOKEN: dev-admin-secret
      BIND: 0.0.0.0:8080
      RUST_LOG: info,server=debug
      WORLD_DIR: /data/worlds
    volumes:
      - ./apps/server/tenants.toml:/etc/teocraft/tenants.toml:ro
      - blocklandia-worlds:/data/worlds
    restart: unless-stopped
    # keep an abuser/runaway from eating the host
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  blocklandia-worlds:
