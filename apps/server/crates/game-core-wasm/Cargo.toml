[package]
name = "game-core-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The browser-loadable wasm module: a thin `#[wasm_bindgen]` shell over the pure `game-core::Room`,
# backed by in-memory (db-free) trait impls for a single-player offline server. Built for
# wasm32-unknown-unknown + wasm-bindgen (see README.md). `cdylib` so it links to a `.wasm`; `rlib`
# so the native unit tests of the in-memory impls compile + run under `cargo test`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
game-core = { path = "../game-core" }
protocol = { path = "../protocol" }
sim = { path = "../sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

# Only the actual wasm build pulls in the browser bindings + a JS-seeded RNG source. The native test
# build (and `cargo build` for the workspace) skips them, so the in-memory impls stay testable on host.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned so the `wasm-bindgen` crate matches the `wasm-bindgen-cli` the build script + Docker image
# install (the two must agree exactly, or binding generation errors).
wasm-bindgen = "=0.2.106"
js-sys = "0.3"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
# `js` makes `getrandom` (pulled in by `rand` inside game-core) read the browser CSPRNG, so
# `StdRng::from_entropy()` links on wasm.
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = "1"
