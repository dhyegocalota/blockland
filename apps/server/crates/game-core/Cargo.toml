[package]
name = "game-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
protocol = { path = "../protocol" }
sim = { path = "../sim" }
rand = "0.8"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"

[features]
# Exposes a focused test-only surface (player inspection + a `FakeHost`) so the server crate's
# room_driver tests can drive the async admit policy against a real `game_core::Room`. Off by default.
test-support = []

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync"] }
