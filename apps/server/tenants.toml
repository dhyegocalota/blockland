# Server-wide resource limits (fixed and global; one room per tenant).
# Tenants themselves are dynamic and live in the database (seeded on first run).
# Override at runtime with TENANTS_FILE=/path/to/limits.toml

[limits]
max_players_per_room = 10
tick_hz = 20
max_conns_per_ip = 32
move_per_sec = 40.0
edit_per_sec = 25.0
chat_per_sec = 2.0
idle_secs = 45
edit_reach = 9.0
max_speed = 18.0
